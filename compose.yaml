services:
  api:
    image: houseprice-api:local
    build: .
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy   # URL наружу не светится, пока API не жив
    profiles: [demo]
