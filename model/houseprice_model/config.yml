# Скалярные решения проекта. Объектный граф пайплайна живёт в builders/ (код).
target: SalePrice
test_size: 0.28  # для v0.1-совместимости; v0.2 обучается на всех данных, гейт по CV
random_state: 0

# Политика обучающих данных. v0.2: фильтр ВЫКЛЮЧЕН — замерено, что удаление
# выбросов (Normal/Partial & GrLivArea<5050) улучшает внутренний holdout, но
# ВРЕДИТ на kaggle-тесте (разрыв CV→kaggle +0.016 с фильтром против +0.002 без):
# kaggle test не отфильтрован, значит и обучение не должно быть.
train_filter:
  enabled: false
  sale_condition: [Normal, Partial]
  grlivarea_max: 5050

# Метрический гейт CI: тест падает, если 5-fold CV RMSLE (на всех данных) хуже.
# v0.2-стек: измеренный CV 0.1159±0.024; порог с запасом.
metric_threshold_rmsle: 0.120
