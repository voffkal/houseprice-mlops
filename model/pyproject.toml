[project]
name = "houseprice-model"
version = "0.2.2"
description = "House price regression: CT-slot pipeline + 10-model stack, packaged for deployment"
license = "MIT"
authors = [{ name = "Voffkal" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.7",
    "feature-engine>=1.8",
    "scipy>=1.13",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # v0.2: базовые ученики стека нужны в РАНТАЙМЕ — артефакт при загрузке
    # распаковывает XGBRegressor/LGBMRegressor/TargetEncoder.
    "category-encoders>=2.6",
    "xgboost>=3.3.0",
    "lightgbm>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["houseprice_model"]
