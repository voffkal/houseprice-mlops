[project]
name = "houseprice-model"
version = "0.1.1"
description = "House price regression: CT-slot pipeline + Ridge, packaged for deployment"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.7",
    "feature-engine>=1.8",
    "scipy>=1.13",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
research = [
    "category-encoders>=2.6",
    "xgboost>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["houseprice_model"]
