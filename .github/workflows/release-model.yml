name: release-model

on:
  push:
    tags: ["model-v*"]

permissions:
  contents: write
  id-token: write      # подпись attestation через Sigstore
  attestations: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Релиз с таким тегом не должен существовать
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Релиз $GITHUB_REF_NAME уже опубликован. Артефакт релиза неизменяем: переобучение на переставленном теге дало бы другой .joblib под тем же именем. Нужен новый артефакт — поднимите версию и запушьте новый тег."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Restore dataset cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: model/houseprice_model/datasets/train.csv
          key: kaggle-house-prices-train-v1

      - name: Fetch dataset from Kaggle
        if: steps.data-cache.outputs.cache-hit != 'true'
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          mkdir -p model/houseprice_model/datasets
          uvx --from kaggle kaggle competitions download \
            -c house-prices-advanced-regression-techniques \
            -f train.csv -p model/houseprice_model/datasets
          cd model/houseprice_model/datasets
          if [ -f train.csv.zip ]; then unzip -o train.csv.zip && rm train.csv.zip; fi

      - name: Gate (полная сюита, включая метрический гейт)
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Train release artifact
        run: uv run python -m houseprice_model.train

      # Подписанное свидетельство «этот .joblib собран этим workflow из этого коммита».
      # sha256 в metrics.json лежит рядом с файлом и подменяется вместе с ним;
      # attestation подделать без запуска нашего workflow нельзя.
      - name: Attest the artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: model/houseprice_model/artifacts/houseprice_model-*.joblib

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(uv run python -c "import json; m=json.load(open('model/houseprice_model/artifacts/metrics.json')); print(f\"cv RMSLE {m['cv_rmsle']['mean']:.4f}±{m['cv_rmsle']['std']:.4f} (oof {m['cv_rmsle']['oof']:.4f}) | baseline lift {m['baseline']['lift_pct']:.1f}% | R2 {m['metrics']['in_sample']['r2']:.4f} | sklearn {m['sklearn']}\")")
          gh release create "$GITHUB_REF_NAME" \
            model/houseprice_model/artifacts/houseprice_model-*.joblib \
            model/houseprice_model/artifacts/input_schema.json \
            model/houseprice_model/artifacts/metrics.json \
            --title "$GITHUB_REF_NAME" --notes "$NOTES"
