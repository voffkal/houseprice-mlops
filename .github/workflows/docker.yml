name: docker

on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts from latest model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
          echo "Использую релиз модели: $TAG"
          mkdir model_artifacts
          gh release download "$TAG" -D model_artifacts

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/voffkal/houseprice-api:${{ github.ref_name }}
            ghcr.io/voffkal/houseprice-api:latest
