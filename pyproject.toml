[project]
name = "houseprice-mlops"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["houseprice-model", "houseprice-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model", "api"]

[tool.uv.sources]
houseprice-model = { workspace = true }
houseprice-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
# *_frozen_draft.py: generated by houseprice_model.freeze via repr() on fitted
# search winners, not hand-authored. repr() on a FunctionTransformer wrapping a
# plain function (e.g. FunctionTransformer(np.zeros_like)) falls back to
# Python's default object repr, which embeds a live memory address
# (`<function zeros_like at 0x...>`) — that is not valid Python syntax, so ruff
# can't even parse the file. These drafts are meant to be eyeballed and hand-
# ported into a builder (see freeze.py docstring), not linted as source.
extend-exclude = ["research/*_frozen_draft.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# preprocessing.py: verbatim port of notebook cells (research/extracted/cell_ct.py,
# cell_params_top_pipe.py) — long lines and long comments must stay byte-identical
# to the source, so line-length is not enforced here.
"model/houseprice_model/preprocessing.py" = ["E501"]
# slot_grid.py: verbatim port of research/extracted/cell_factories.py + the
# `params = {...}` dict from cell_params_top_pipe.py — same rationale as above.
"research/slot_grid.py" = ["E501"]
# v01_ridge.py: FROZEN_RIDGE_PARAMS is transferred verbatim from
# research/ridge_frozen_draft.py (Task 5 search winner) — values are not
# hand-edited, so long constructor calls can't be wrapped by hand. `ruff
# format` would fix the one long line but also rewrites quote style across
# the whole verbatim dict, which is exactly the "clean up the repr" this
# file must avoid — so line-length is ignored here instead.
"model/houseprice_model/builders/v01_ridge.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["model/tests", "api/app/tests"]
filterwarnings = [
    # joblib 1.5 внутри numpy_pickle.py присваивает array.shape — депрекейчено в
    # NumPy 2.5 (срабатывает при joblib.load наших артефактов). Не наш код;
    # узкий фильтр, чтобы вывод тестов оставался стерильным. Убрать, когда
    # joblib обновит numpy_pickle (следить при бампах joblib в uv.lock).
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
