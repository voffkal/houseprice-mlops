[project]
name = "houseprice-mlops"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["houseprice-model"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model"]

[tool.uv.sources]
houseprice-model = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# preprocessing.py: verbatim port of notebook cells (research/extracted/cell_ct.py,
# cell_params_top_pipe.py) — long lines and long comments must stay byte-identical
# to the source, so line-length is not enforced here.
"model/houseprice_model/preprocessing.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["model/tests"]
